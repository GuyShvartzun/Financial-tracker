<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1B5E20" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  
  <!-- Subtle inner border -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#81C784" stroke-width="6" opacity="0.4" />
  
  <!-- Shekel Sign Icon -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="'Heebo', 'Rubik', sans-serif" font-weight="900" font-size="280" fill="#FFFFFF">₪</text>
</svg>
